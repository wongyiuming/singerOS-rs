name: format-branch

on:
  push:
    branches: [build/rust-production-rn-cd]

permissions:
  contents: write

jobs:
  rustfmt:
    if: "${{ !contains(github.event.head_commit.message, 'style: rustfmt') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install rustfmt
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: rustfmt production migration'
          git push origin HEAD:${GITHUB_REF_NAME}
