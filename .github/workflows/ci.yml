name: rust-future-ci
on:
  push:
  pull_request:

jobs:
  mainline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rustfmt --component clippy --component rust-src --target wasm32-unknown-unknown
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude compiler-contracts --exclude portable-simd-dsp --exclude const-audio-layout --exclude audio-worklet-lab --all-targets -- -D warnings
      - run: cargo test --workspace --exclude compiler-contracts --exclude portable-simd-dsp --exclude const-audio-layout --exclude audio-worklet-lab
      - run: cargo check -p singer-web --target wasm32-unknown-unknown

  compiler-lab:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rust-src
      - name: Negative bounds + Polonius-next
        run: cargo test -p compiler-contracts --lib
        env:
          RUSTFLAGS: -Zinternal-testing-features -Zpolonius=next

  simd-lab:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal
      - run: cargo test -p portable-simd-dsp --lib

  const-layout-lab:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal
      - run: cargo test -p const-audio-layout --lib

  audio-worklet-lab:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Compile CPAL AudioWorklet with Wasm atomics
        run: cargo check -p audio-worklet-lab --target wasm32-unknown-unknown -Zbuild-std=std,panic_abort
        env:
          RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals
