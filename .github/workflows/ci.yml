name: rust-future-ci
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  mainline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rustfmt --component clippy --component rust-src --target wasm32-unknown-unknown
      - run: rustup show
      - name: Apply parity compile fixes once
        if: github.ref == 'refs/heads/feat/production-parity'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/singer-web/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              'player.remove_attribute("src");',
              'let _ = player.remove_attribute("src");',
          )
          s = s.replace(
              'if selected.get_untracked().is_empty() {\n                if let Some(first) = list.first() {\n                    selected.set(first.id.clone());\n                }\n            }',
              'if selected.get_untracked().is_empty()\n                && let Some(first) = list.first()\n            {\n                selected.set(first.id.clone());\n            }',
          )
          start = s.index('fn lyric_text(')
          end = s.index('fn render_lyrics(', start)
          chunk = s[start:end].replace('current_song(catalog, &id)', 'current_song(catalog, id)')
          s = s[:start] + chunk + s[end:]
          p.write_text(s)
          PY
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/singer-web/src/lib.rs
            git commit -m "fix: satisfy strict parity clippy"
            git push origin HEAD:feat/production-parity
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude compiler-contracts --all-targets -- -D warnings
      - run: cargo test --workspace --exclude compiler-contracts
      - run: cargo check -p singer-web --target wasm32-unknown-unknown

  compiler-lab:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rust-src
      - run: rustup show
      - name: Negative bounds + Polonius-next
        run: cargo test -p compiler-contracts --lib
        env:
          RUSTFLAGS: -Zinternal-testing-features -Zpolonius=next
