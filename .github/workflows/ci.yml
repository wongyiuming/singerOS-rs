name: rust-future-ci
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  mainline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rustfmt --component clippy --component rust-src --target wasm32-unknown-unknown
      - run: rustup show
      - name: Apply parity compile fixes once
        if: github.ref == 'refs/heads/feat/production-parity'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/singer-web/src/audio.rs')
          s = p.read_text()
          s = s.replace(
              'let Some(e) = slot.borrow().as_ref() else {\n            return 0;\n        };',
              'let binding = slot.borrow();\n        let Some(e) = binding.as_ref() else {\n            return 0;\n        };',
          )
          s = s.replace(
              'let blob = event.data();\n        if blob.size() == 0 {',
              'let Some(blob) = event.data() else {\n            return;\n        };\n        if blob.size() == 0 {',
          )
          p.write_text(s)

          p = Path('crates/singer-web/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              'render_lyrics(catalog.get(), &selected.get(), &mode.get(), lyric_index)',
              'render_lyrics(catalog.get(), selected.get(), mode.get(), lyric_index)',
          )
          s = s.replace(
              'render_lyrics(catalog.get(),&selected.get(),&mode.get(),lyric_index)',
              'render_lyrics(catalog.get(),selected.get(),mode.get(),lyric_index)',
          )
          s = s.replace('    id: &str,\n    mode: &str,', '    id: String,\n    mode: String,')
          s = s.replace('current_song(catalog, id)', 'current_song(catalog, &id)')
          s = s.replace('lyrics_for(&s, mode)', 'lyrics_for(&s, &mode)')
          p.write_text(s)

          p = Path('crates/singer-audio/Cargo.toml')
          s = p.read_text()
          s = s.replace('singer-core = { path = "../singer-core" }\n', '')
          s = s.replace('thiserror.workspace = true\n', '')
          p.write_text(s)
          PY
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates
            git commit -m "fix: resolve Rust WASM compile errors"
            git push origin HEAD:feat/production-parity
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude compiler-contracts --all-targets -- -D warnings
      - run: cargo test --workspace --exclude compiler-contracts
      - run: cargo check -p singer-web --target wasm32-unknown-unknown

  compiler-lab:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-13 --profile minimal --component rust-src
      - run: rustup show
      - name: Negative bounds + Polonius-next
        run: cargo test -p compiler-contracts --lib
        env:
          RUSTFLAGS: -Zinternal-testing-features -Zpolonius=next
