[workspace]
resolver = "3"
members = [
  "crates/singer-core",
  "crates/singer-audio",
  "crates/singer-web",
  "crates/singer-server",
  "crates/singer-store",
]
exclude = [
  "labs/compiler-contracts",
  "labs/portable-simd-dsp",
  "labs/const-audio-layout",
  "labs/audio-worklet",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
