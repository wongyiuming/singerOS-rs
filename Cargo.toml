[workspace]
resolver = "3"
members = [
  "crates/singer-core",
  "crates/singer-audio",
  "crates/singer-web",
  "crates/singer-server",
  "crates/singer-store",
  "labs/compiler-contracts",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
