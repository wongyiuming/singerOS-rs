[package]
name = "singer-web"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
singer-core = { path = "../singer-core" }
singer-audio = { path = "../singer-audio" }
web-sys = { version = "0.3", features = [
  "Window", "Navigator", "MediaDevices", "MediaStream",
  "AudioContext", "GainNode", "DynamicsCompressorNode",
  "MediaRecorder", "HtmlAudioElement"
] }
