[package]
name = "singer-web"
version = "0.2.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = "0.6"
serde.workspace = true
serde_json.workspace = true
singer-core = { path = "../singer-core" }
singer-audio = { path = "../singer-audio" }
web-sys = { version = "0.3", features = [
  "Window", "Navigator", "MediaDevices", "MediaStream", "MediaStreamConstraints",
  "AudioContext", "GainNode", "DynamicsCompressorNode", "MediaRecorder",
  "Blob", "BlobEvent", "Event", "HtmlAudioElement", "HtmlMediaElement", "Url"
] }
