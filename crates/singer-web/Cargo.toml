[package]
name = "singer-web"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
singer-core = { path = "../singer-core" }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AnalyserNode", "AudioContext", "AudioDestinationNode", "AudioNode", "AudioParam",
  "BiquadFilterNode", "BiquadFilterType", "Blob", "BlobEvent", "Document", "Element", "Event",
  "EventTarget", "GainNode", "HtmlAudioElement", "HtmlElement", "HtmlMediaElement", "KeyboardEvent", "Location",
  "MediaDeviceInfo", "MediaDeviceKind", "MediaDevices", "MediaRecorder", "MediaStream", "MediaStreamConstraints",
  "MediaStreamAudioDestinationNode", "MediaStreamAudioSourceNode", "MediaStreamTrack", "Navigator",
  "DynamicsCompressorNode", "Window"
] }
