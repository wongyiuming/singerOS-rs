[package]
name = "singer-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde.workspace = true
serde_json.workspace = true
singer-core = { path = "../singer-core" }
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "sync", "time", "fs", "io-util"] }
